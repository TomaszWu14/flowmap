# FlowMap: app + PostgreSQL. Works locally (`docker compose up`) and as a Coolify "Docker Compose" resource.
# Coolify fills SERVICE_* variables automatically; locally put them in .env (see .env.example).
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: production
      SECRET_KEY: ${SERVICE_PASSWORD_64_SECRETKEY:?set SECRET_KEY}
      DATABASE_URL: postgresql://flowmap:${SERVICE_HEX_32_POSTGRES:?set DB password}@db:5432/flowmap
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-100}
      DEMO_VISITOR_GATE: ${DEMO_VISITOR_GATE:-true}
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      NTFY_WATCH_COMPANIES: ${NTFY_WATCH_COMPANIES:-}
      NTFY_ENGAGED_VIEWS: ${NTFY_ENGAGED_VIEWS:-10}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowmap
      POSTGRES_DB: flowmap
      POSTGRES_PASSWORD: ${SERVICE_HEX_32_POSTGRES:?set DB password}
    volumes:
      - flowmap-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowmap -d flowmap"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Daily pg_dump (attachments live in the DB too), kept 14 days. Restore: see docs/kopie-zapasowe.md.
  # ponytail: same server as the DB — survives a broken migration or a deleted project, not a lost disk;
  # copy /backups off-site (Coolify S3 backup or rclone) when that risk matters.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: flowmap
      PGDATABASE: flowmap
      PGPASSWORD: ${SERVICE_HEX_32_POSTGRES:?set DB password}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_EVERY_SECONDS: ${BACKUP_EVERY_SECONDS:-86400}
    volumes:
      - flowmap-backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/flowmap-$$(date -u +%Y%m%d-%H%M).dump
          if pg_dump -Fc -f "$$f.part" && mv "$$f.part" "$$f"; then echo "backup ok: $$f"; else echo "backup FAILED"; rm -f "$$f.part"; fi
          find /backups -name 'flowmap-*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep $$BACKUP_EVERY_SECONDS
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  flowmap-db:
  flowmap-backups:
